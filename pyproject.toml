[project]
name = "vibepiler"
version = "0.1.0"
description = "A compiler for vibe-coded software: parse a whole project into a program graph, then run optimization passes that find dead code, duplicates, cycles, over-abstraction and bloat."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "networkx>=3.5",
    "pathspec>=0.12",
    "rich>=13",
    "tree-sitter>=0.25",
    "tree-sitter-language-pack>=0.9",
    "typer>=0.12",
]

[project.scripts]
vibepiler = "vibepiler.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vibepiler"]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
norecursedirs = ["fixtures", ".venv", "node_modules"]
