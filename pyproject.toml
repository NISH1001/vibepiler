[project]
name = "vibepiler"
dynamic = ["version"]
license = "MIT"
license-files = ["LICENSE"]
description = "A compiler for vibe-coded software: parse a whole project into a program graph, then run optimization passes that find dead code, duplicates, cycles, over-abstraction and bloat."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "networkx>=3.5",
    "pathspec>=0.12",
    "rich>=13",
    "tree-sitter>=0.25",
    "tree-sitter-language-pack>=0.9",
    "typer>=0.12",
]

[project.scripts]
vibepiler = "vibepiler.cli:app"

[project.optional-dependencies]
semantic = [
    "fastembed>=0.4",
    "huggingface-hub>=0.20",
    "model2vec>=0.4",
    "numpy>=1.26",
]
map = [
    "umap-learn>=0.5",
]

[tool.vibepiler]
ignore = ["tests/fixtures/**"]                     # deliberately bloated sample projects for the test suite
accept = [                                         # self-findings judged intentional; counted, not reported
    "class-as-function:*Embedder",                 # they implement the Embedder protocol and hold a loaded model
    "thin-wrapper:ProgramGraph.*_edges",           # the public API is one accessor per direction
    "near-duplicate-function:Diagnostic.to_dict",  # every to_dict is a dict literal of its fields
    "single-use-helper:*_id",                      # module_id/symbol_id/package_id define the id scheme in one place
    "single-use-helper:get_pass",
]

[tool.hatch.version]
path = "src/vibepiler/__init__.py"  # the one place the version lives

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vibepiler"]

[dependency-groups]
dev = [
    "fastembed>=0.4",
    "model2vec>=0.4",
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
norecursedirs = ["fixtures", ".venv", "node_modules"]
